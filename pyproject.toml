[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "devtox-browser"
dynamic = ["version"]
description = "Browser leggero per sviluppatori Linux, con terminale integrato (GTK 3 + WebKitGTK)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "XENON1354" }]
# PyGObject, pycairo, GTK, WebKitGTK e VTE arrivano dai pacchetti di sistema:
# il virtualenv va creato con --system-site-packages (vedi README)
dependencies = []
keywords = ["browser", "webkit", "gtk", "terminal", "developer-tools", "privacy"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.urls]
Homepage = "https://github.com/Tommaso-Palestini/devtox-browser"
Issues = "https://github.com/Tommaso-Palestini/devtox-browser/issues"
Changelog = "https://github.com/Tommaso-Palestini/devtox-browser/blob/main/CHANGELOG.md"

[project.scripts]
devtox = "devtox.__main__:main"

[tool.setuptools]
packages = ["devtox", "devtox.webext"]
script-files = ["bin/dx"]

[tool.setuptools.package-data]
devtox = ["resources/*", "resources/icons/*", "locale/*.po"]
"devtox.webext" = ["*.c", "*.sh"]

[tool.setuptools.dynamic]
version = { attr = "devtox.__version__" }
