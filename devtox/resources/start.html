<!doctype html>
<html lang="{{it}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{Nuova tab}}</title>
<style>
  /* Stessi valori di theme.css: la pagina e la finestra sono un pezzo solo.
     Griglia: contenuto max 1120px = 2fr (lavoro) + 64px + 1fr (riferimenti). */
  :root {
    --page: #0e0e10;
    --chrome: #161618;
    --raised: #1d1d20;
    --rule: #1f1f23;
    --edge: #2c2c31;
    --text: #ececee;
    --muted: #9a9ca3;
    --accent: #73c991;
    --ui: "Fira Sans", "Inter", system-ui, sans-serif;
    --mono: "Fira Mono", "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 72px 32px 96px;
    background: var(--page);
    color: var(--text);
    font: 400 14px/1.5 var(--ui);
  }
  main { max-width: 1120px; margin: 0 auto; }
  a { color: inherit; text-decoration: none; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  .mono { font-family: var(--mono); }
  .quiet { color: var(--muted); }

  /* --- Il prompt: si scrive come in una shell ---------------------------- */
  .prompt {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 0 0 18px;
    border-bottom: 1px solid var(--edge);
    transition: border-color 160ms ease-out;
  }
  .prompt:focus-within { border-bottom-color: var(--accent); }
  .sigil { font: 600 30px/1 var(--mono); color: var(--accent); }
  .prompt input {
    flex: 1;
    min-width: 0;
    padding: 0;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    caret-color: var(--accent);
    font: 400 26px/1.2 var(--mono);
    letter-spacing: -0.01em;
  }
  .prompt input::placeholder { color: #6f7178; }
  .status {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 4px 24px;
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .status a:hover { color: var(--text); }

  /* --- Le due colonne ---------------------------------------------------- */
  .board {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
    gap: 56px 64px;
    margin-top: 64px;
    align-items: start;
  }
  .col { display: grid; gap: 48px; align-content: start; }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 10px;
  }
  h2 { margin: 0; font: 600 15px/1.3 var(--ui); }
  .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* --- Server: l'elemento che solo questo browser può mostrare ----------- */
  table.servers { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .servers th, .servers td {
    height: 46px;
    padding: 0 12px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-bottom: 1px solid var(--rule);
  }
  .servers th:first-child, .servers td:first-child { padding-left: 0; }
  .servers th:last-child, .servers td:last-child { padding-right: 0; }
  .servers thead th {
    height: 32px;
    font: 400 12px/1 var(--ui);
    color: var(--muted);
    border-bottom-color: var(--edge);
  }
  .servers col.c-port { width: 104px; }
  .servers col.c-tool { width: 128px; }
  .servers col.c-up { width: 112px; }
  .servers col.c-pid { width: 72px; }
  .servers .num { text-align: right; font-variant-numeric: tabular-nums; }
  .servers tbody tr { position: relative; transition: background-color 120ms ease-out; }
  .servers tbody tr:hover { background: var(--chrome); }
  .servers tbody tr:active { background: var(--raised); }
  /* Tutta la riga apre il server; il link resta sulla porta per tastiera e lettori */
  .servers a.port::after { content: ""; position: absolute; inset: 0; }
  .servers a.port {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: 500 18px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    outline: none;
  }
  .servers a.port:focus-visible::after { outline: 1px solid var(--accent); outline-offset: -1px; }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .servers .tool { font-weight: 500; }
  .servers .path { font: 400 13px/1 var(--mono); color: var(--muted); }
  .servers tbody tr:hover .path { color: var(--text); }

  .empty {
    padding: 20px 22px;
    border: 1px dashed var(--edge);
    border-radius: 8px;
  }
  .empty p { margin: 0; max-width: 62ch; }
  .empty p + p { margin-top: 6px; }
  code {
    font: 400 12.5px/1 var(--mono);
    color: var(--text);
    padding: 2px 5px;
    border-radius: 4px;
    background: var(--raised);
  }

  /* --- Liste di link: ultime pagine e preferiti --------------------------- */
  .links { display: grid; gap: 1px; padding: 0; margin: 0 -10px; list-style: none; }
  .links a {
    display: grid;
    gap: 1px;
    padding: 8px 10px;
    border-radius: 6px;
    transition: background-color 120ms ease-out;
  }
  .links a:hover { background: var(--chrome); }
  .links a:active { background: var(--raised); }
  .links a:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
  .links .title, .links .meta { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .links .meta { font: 400 12px/1.4 var(--mono); color: var(--muted); }
  .col > section > p.quiet { margin: 0; }
  .wide .links { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }

  /* --- Barra dei tasti in fondo, come in htop e nano ------------------- */
  .keybar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 22px;
    margin: 0;
    padding: 9px 32px;
    list-style: none;
    background: var(--chrome);
    color: var(--muted);
    font-size: 13px;
  }
  .keybar li { white-space: nowrap; }
  kbd {
    display: inline-block;
    margin-right: 4px;
    font: 500 12px/1 var(--mono);
    color: var(--page);
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--muted);
  }
  .keybar li:first-child kbd { background: var(--accent); }
  .empty kbd { margin: 0 2px; padding: 2px 5px; color: var(--text); background: var(--raised); }

  /* Una riga sola, sempre: le voci meno usate escono per prime */
  @media (max-width: 1260px) { .keybar li:nth-child(n+7) { display: none; } }
  @media (max-width: 1080px) { .keybar li:nth-child(n+5) { display: none; } }
  @media (max-width: 880px) {
    .keybar li:nth-child(n+5) { display: list-item; }
    body { padding: 40px 20px 40px; }
    .board { grid-template-columns: 1fr; margin-top: 48px; }
    .wide .links { grid-template-columns: 1fr; }
    .servers col.c-pid, .servers th:last-child, .servers td:last-child { display: none; }
    .servers td:nth-last-child(2) { padding-right: 0; }
    .keybar { position: static; margin: 56px -20px -40px; padding: 10px 20px; }
    .sigil { font-size: 24px; }
    .prompt input { font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">{{Nuova tab}}</h1>
  <form class="prompt" action="devtox://go" method="get" role="search">
    <span class="sigil" aria-hidden="true">$$</span>
    <input name="q" autocomplete="off" spellcheck="false" autofocus
           placeholder="{{cerca, oppure localhost:5173}}" aria-label="{{Cerca o apri un indirizzo}}">
  </form>
  <p class="status">
    <span>$search_hint</span>
    <a href="devtox://setup" title="{{Cambia le impostazioni}}">$privacy</a>
  </p>

  <div class="board">
    <div class="col">
      <section aria-labelledby="h-servers">
        <div class="head">
          <h2 id="h-servers">{{In esecuzione su questo PC}}</h2>
          <span class="count">$servers_count</span>
        </div>
        $servers
      </section>
      <section class="wide" aria-labelledby="h-bookmarks">
        <div class="head"><h2 id="h-bookmarks">{{Preferiti}}</h2></div>
        $bookmarks
      </section>
    </div>
    <div class="col">
      <section aria-labelledby="h-recent">
        <div class="head"><h2 id="h-recent">{{Pagine recenti}}</h2></div>
        $recent
      </section>
    </div>
  </div>
</main>
<ul class="keybar" aria-label="{{Tasti}}">$keys</ul>
</body>
</html>
