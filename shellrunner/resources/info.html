<!doctype html>
<html lang="{{it}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  :root {
    --void: #0e0b19;
    --deck: #171228;
    --seam: #2c2348;
    --ink: #e9e4ff;
    --haze: #8d84b8;
    --magenta: #ff2e88;
    --cyan: #2de2e6;
    --amber: #ffb627;
    --ui: "Fira Sans Condensed", "Fira Sans", system-ui, sans-serif;
    --display: "Fira Sans Compressed", "Fira Sans Condensed", sans-serif;
    --mono: "Fira Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 10vh 16px 48px;
    background:
      radial-gradient(60vw 40vh at 8% 0%, rgba(255, 46, 136, 0.10), transparent 70%),
      var(--void);
    color: var(--ink);
    font: 400 16px/1.55 var(--ui);
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 {
    margin: 0 0 6px;
    font: 800 clamp(2.2rem, 6vw, 3.2rem)/1 var(--display);
    color: var(--magenta);
    text-shadow: 0 0 18px rgba(255, 46, 136, 0.45);
  }
  .lead { margin: 0 0 32px; color: var(--haze); }
  h2 { margin: 40px 0 12px; font: 600 1rem/1.2 var(--ui); color: var(--haze); }
  p { max-width: 64ch; }
  a { color: var(--cyan); }
  code, kbd { font-family: var(--mono); font-size: 0.9em; }
  code { color: var(--cyan); word-break: break-all; }
  kbd {
    color: var(--ink);
    padding: 2px 7px;
    border: 1px solid var(--seam);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--deck);
  }
  .steps { display: grid; gap: 12px; padding: 0; margin: 0; list-style: none; }
  .steps li {
    padding: 14px 16px;
    border: 1px solid var(--seam);
    border-left: 2px solid var(--magenta);
    border-radius: 8px;
    background: var(--deck);
  }
  .steps li.shell { border-left-color: var(--cyan); }
  .steps strong { display: block; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--seam); text-align: left; vertical-align: top; }
  th { width: 34%; color: var(--haze); font-weight: 500; }
  .warn { color: var(--amber); }
  .actions { margin-top: 32px; }
  .button {
    display: inline-block;
    padding: 10px 18px;
    border: 1px solid var(--magenta);
    border-radius: 8px;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 0 14px rgba(255, 46, 136, 0.25);
  }
  .button:hover, .button:focus-visible { box-shadow: 0 0 22px rgba(255, 46, 136, 0.5); outline: none; }
  button.button { background: transparent; font: inherit; cursor: pointer; }
  .button.ghost { border-color: var(--seam); box-shadow: none; color: var(--haze); margin-left: 8px; }
  .button.ghost:hover, .button.ghost:focus-visible { border-color: var(--haze); color: var(--ink); box-shadow: none; }

  /* Form della configurazione iniziale */
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .choices.row { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .choice, .switch {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px;
    border: 1px solid var(--seam); border-radius: 8px;
    background: var(--deck);
    cursor: pointer;
    transition: border-color 160ms ease-out, box-shadow 200ms ease-out;
  }
  .choice:hover, .switch:hover { border-color: var(--haze); }
  .choice:has(input:checked) { border-color: var(--magenta); box-shadow: 0 0 14px rgba(255, 46, 136, 0.2); }
  .switch:has(input:checked) { border-color: var(--cyan); }
  .choice span, .switch span, .field { display: flex; flex-direction: column; gap: 2px; }
  .choice small, .switch small, .field small, .hint { color: var(--haze); font-size: 0.88rem; }
  .switches { display: grid; gap: 10px; }
  input[type="radio"], input[type="checkbox"] { accent-color: var(--magenta); margin-top: 4px; width: 18px; height: 18px; flex: none; }
  .switch input { accent-color: var(--cyan); }
  .field input {
    margin: 6px 0 2px; padding: 10px 12px; max-width: 360px;
    border: 1px solid var(--seam); border-radius: 8px; background: var(--deck);
    color: var(--ink); font: 400 1rem var(--mono); outline: none;
  }
  .field input:focus { border-color: var(--cyan); }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .preset {
    padding: 6px 12px; border: 1px solid var(--seam); border-radius: 999px;
    background: transparent; color: var(--ink); font: inherit; font-size: 0.9rem; cursor: pointer;
  }
  .preset:hover, .preset:focus-visible { border-color: var(--magenta); outline: none; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
$body
</main>
</body>
</html>
