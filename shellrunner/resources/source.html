<!doctype html>
<html lang="{{it}}">
<head>
<meta charset="utf-8">
<title>$title</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0e0e10;
    color: #ececee;
    font: 13px/1.6 "Fira Mono", ui-monospace, monospace;
  }
  header {
    position: sticky; top: 0;
    padding: 8px 16px;
    background: #161618;
    border-bottom: 1px solid #26262a;
    color: #94969d;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  pre { margin: 0; padding: 12px 0; counter-reset: line; white-space: pre-wrap; word-break: break-all; }
  .line { display: block; padding: 0 16px 0 72px; position: relative; }
  .line::before {
    counter-increment: line;
    content: counter(line);
    position: absolute; left: 0; width: 56px;
    text-align: right; color: #6b6d73;
    user-select: none;
  }
  .line:hover { background: #161618; }
  .tag { color: #73c991; }
  .note { margin: 0; padding: 8px 16px; color: #d9a441; font-family: "Fira Sans", system-ui, sans-serif; }
</style>
</head>
<body>
<header>$url</header>
$note
<pre>$lines</pre>
</body>
</html>
