<!doctype html>
<html lang="{{it}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{HTTPS non disponibile}}</title>
<style>
  :root {
    --void: #0e0b19; --deck: #171228; --seam: #2c2348; --ink: #e9e4ff;
    --haze: #8d84b8; --amber: #ffb627; --magenta: #ff2e88;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: radial-gradient(60vw 50vh at 50% 0%, rgba(255, 182, 39, 0.08), transparent 70%), var(--void);
    color: var(--ink);
    font: 400 16px/1.55 "Fira Sans Condensed", "Fira Sans", system-ui, sans-serif;
  }
  main {
    max-width: 600px;
    padding: 28px 32px;
    border: 1px solid var(--seam);
    border-left: 3px solid var(--amber);
    border-radius: 12px;
    background: var(--deck);
  }
  h1 { margin: 0 0 12px; font: 700 1.9rem/1.15 "Fira Sans Compressed", "Fira Sans Condensed", sans-serif; }
  p { margin: 0 0 12px; }
  .reason { color: var(--haze); font: 400 0.9rem/1.4 "Fira Mono", monospace; }
  a.continue {
    display: inline-block; margin-top: 8px; padding: 8px 14px;
    border: 1px solid var(--amber); border-radius: 8px;
    color: var(--amber); text-decoration: none;
    transition: background-color 160ms ease-out, box-shadow 200ms ease-out;
  }
  a.continue:hover, a.continue:focus-visible {
    background: rgba(255, 182, 39, 0.12); box-shadow: 0 0 16px rgba(255, 182, 39, 0.3); outline: none;
  }
  .note { color: var(--haze); font-size: 0.9rem; margin-top: 14px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <main>
    <h1>{{$host non risponde in HTTPS}}</h1>
    <p>{{Shellrunner ha provato a collegarsi in modo cifrato, ma non ci è riuscito.}}</p>
    <p class="reason">$reason</p>
    <p>{{In HTTP la connessione non è cifrata: chi è sulla tua rete può leggere e modificare la pagina.}}</p>
    <a class="continue" href="$http_uri">{{Continua in HTTP su $host}}</a>
    <p class="note">$note</p>
  </main>
</body>
</html>
