name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            gir1.2-soup-3.0 gir1.2-vte-2.91 gcc pkg-config libglib2.0-dev xvfb
      - name: Test (compresa la prova d'avvio in Xvfb)
        run: PYTHON=/usr/bin/python3 sh scripts/check.sh
