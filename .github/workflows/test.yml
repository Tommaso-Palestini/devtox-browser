name: test

on: [push, pull_request]

permissions:
  contents: read

# Un push nuovo sullo stesso ramo annulla la corsa vecchia
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Librerie di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            gir1.2-soup-3.0 gir1.2-vte-2.91 gcc pkg-config libglib2.0-dev xvfb \
            pyflakes3 shellcheck desktop-file-utils appstream
      - name: Controlli statici
        run: |
          python3 -m pyflakes devtox tests scripts bin/dx
          shellcheck install.sh devtox/webext/build.sh scripts/check.sh
          desktop-file-validate data/io.github.Tommaso_Palestini.devtox-browser.desktop
          appstreamcli validate --no-net data/io.github.Tommaso_Palestini.devtox-browser.metainfo.xml
      - name: Traduzioni complete
        run: python3 scripts/update_po.py --check
      - name: Test (compresa la prova d'avvio in Xvfb)
        run: PYTHON=/usr/bin/python3 sh scripts/check.sh
      # Ultimo passo: setup-python cambia il python3 del sistema usato sopra
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Sintassi compatibile con Python 3.10 (requires-python)
        run: python -m compileall -q devtox tests scripts && python -m py_compile bin/dx
